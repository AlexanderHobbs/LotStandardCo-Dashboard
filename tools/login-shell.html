<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Command Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --primary:#5D6E7E; --secondary:#6C7E82; --support:#C8D1D9;
  --canvas:#F3F5F7; --surface:#FFFFFF; --line:#E1E6EB; --fg:#26303A; --muted:#6F7C88;
  --primary-ink:#FFFFFF; --danger:#A6403A;
}
@media (prefers-color-scheme: dark){:root{
  --primary:#9DB0C1; --secondary:#93A7AB; --support:#3A4550;
  --canvas:#101418; --surface:#192026; --line:#2A333C; --fg:#E4E9EE; --muted:#93A0AC;
  --primary-ink:#14191E; --danger:#E08A82; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--fg);font-family:"Open Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(color-mix(in srgb,var(--primary) 16%,transparent) 1px,transparent 1.3px);background-size:14px 14px}
.box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px 26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 18px 40px rgba(30,40,50,.08)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand path{fill:var(--primary)}
.brand span{font-weight:700;font-size:19px;letter-spacing:-.01em}
h1{margin:0;font-size:22px;font-weight:700}
.lead{margin:-12px 0 0;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-family:"Jost","Futura",system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=password]{font:inherit;font-size:15px;letter-spacing:normal;text-transform:none;color:var(--fg);background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=password]:focus{outline:2px solid var(--primary);outline-offset:1px}
.hiddenuser{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 16px;background:var(--primary);color:var(--primary-ink);cursor:pointer}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.7;cursor:wait}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.err{color:var(--danger);margin:0;font-size:13px}
.foot{margin:0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 6h24c3 0 5 2.6 4.2 5.5L40.5 89c-.8 3.3-3.6 5-6.7 5H12c-3 0-5-2.6-4.2-5.5L25.5 11c.8-3 2.4-5 4.5-5z"/><path d="M50 70h40c3 0 5 2.6 4.2 5.5l-3.6 13.5c-.8 3.2-3.5 5-6.6 5H45c-3 0-5-2.6-4.2-5.5l3.6-13.4C45.2 72 47 70 50 70z"/></svg>
    <span>Lot Standard Co</span>
  </div>
  <h1>Sign in to Command Desk</h1>
  <p class="lead">Enter your dashboard password to continue.</p>
  <form id="login" autocomplete="on">
    <input class="hiddenuser" type="text" name="username" autocomplete="username" value="Command Desk" tabindex="-1" aria-hidden="true">
    <label for="pw">Password<input id="pw" name="password" type="password" autocomplete="current-password" required autofocus></label>
    <p class="err" id="err" role="alert" hidden></p>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p class="foot">You'll be asked again each time the page loads.</p>
</main>
<script id="vault" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  var form=document.getElementById("login"), pw=document.getElementById("pw"), err=document.getElementById("err"), go=document.getElementById("go");
  function show(msg){err.textContent=msg;err.hidden=false}
  if(!window.crypto||!crypto.subtle){show("This browser can't unlock the dashboard. Open it in a current version of Safari or Chrome.");go.disabled=true;return}
  var p=JSON.parse(document.getElementById("vault").textContent);
  var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  form.addEventListener("submit",async function(e){
    e.preventDefault(); err.hidden=true; go.disabled=true; go.textContent="Unlocking…";
    try{
      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(p.salt),iterations:p.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(p.iv)},key,u8(p.ct)));
      document.open(); document.write(html); document.close();
    }catch(_){
      show("That password didn't work. Check it and try again.");
      go.disabled=false; go.textContent="Unlock"; pw.select();
    }
  });
})();
</script>
</body>
</html>
