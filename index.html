<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Command Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Open+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed sidebar + main column (top bar, title row, pinned cards, group cards in two columns), right slide-in panel for adding */
:root{
  --primary:#5D6E7E; --secondary:#6C7E82; --support:#C8D1D9; --bg:#FFFFFF;
  --canvas:#F3F5F7; --surface:#FFFFFF; --line:#E1E6EB; --fg:#26303A; --muted:#6F7C88;
  --primary-ink:#FFFFFF; --soft:#EEF1F4; --danger:#A6403A; --scrim:rgba(30,38,46,.38);
  --f-head:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Open Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#9DB0C1; --secondary:#93A7AB; --support:#3A4550; --bg:#14191E;
  --canvas:#101418; --surface:#192026; --line:#2A333C; --fg:#E4E9EE; --muted:#93A0AC;
  --primary-ink:#14191E; --soft:#212A32; --danger:#E08A82; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#9DB0C1; --secondary:#93A7AB; --support:#3A4550; --bg:#14191E;
  --canvas:#101418; --surface:#192026; --line:#2A333C; --fg:#E4E9EE; --muted:#93A0AC;
  --primary-ink:#14191E; --soft:#212A32; --danger:#E08A82; --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* Sidebar */
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px;text-decoration:none;color:var(--fg)}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font-family:"Open Sans",sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.mark-l{fill:var(--primary)}
nav{display:flex;flex-direction:column;gap:2px}
.navlabel{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;color:var(--fg);font-weight:500;position:relative}
.nav:hover{background:var(--soft)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
.nav.on{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-16px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav.on .count{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary)}
.side-spacer{flex:1}
.promo{border-radius:12px;padding:16px;color:#fff;background:linear-gradient(160deg,#6A7C8C 0%,#4C5A67 70%);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.promo::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.2px);background-size:9px 9px;mask-image:linear-gradient(200deg,#000,transparent 60%);pointer-events:none}
.promo .chip{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.92);display:grid;place-items:center}
.promo .chip svg{width:18px;height:18px}
.promo b{font-size:15px}
.promo p{margin:0;font-size:12px;opacity:.85}
.promo button{margin-top:8px;border:0;border-radius:999px;padding:9px 12px;background:#fff;color:#3F4C58;font-weight:600;position:relative;z-index:1}
.promo button:hover{background:#C8D1D9}

/* Main */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.mbrand{display:none}
.search{position:relative;flex:0 1 340px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:999px;padding:8px 44px 8px 36px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 7px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--soft)}
.avatar{width:36px;height:36px;border-radius:999px;background:var(--support);color:#3F4C58;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:13px;letter-spacing:.04em}

.content{padding-block:26px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.titlerow h1{font-family:var(--f-body);font-weight:700;font-size:24px;margin:0 auto 0 0;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;color:var(--fg);white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill:hover{background:var(--soft)}
.pill.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 6px color-mix(in srgb,var(--primary) 35%,transparent)}
.pill.primary:hover{filter:brightness(1.06)}
.pill.static{cursor:default}
.pill.static:hover{background:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* Pinned cards */
.pins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pin{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
a.pin:hover{border-color:var(--support);box-shadow:0 6px 18px rgba(40,52,62,.07)}
.pin .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pin .pn{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .pi{color:var(--primary)}
.pin .big{font-family:var(--f-body);font-weight:700;font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary)}
.pin.unset .big{color:var(--muted);font-weight:600;font-size:16px;padding-block:3px}
.pin.unset{border-style:dashed;cursor:pointer;text-align:left;background:var(--surface)}

/* Group cards */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.group{padding:18px 18px 8px}
.gh{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.gh h2{font-size:16px;font-weight:700;margin:0}
.gh .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gh .gadd{margin-left:auto;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px;font-weight:600;font-size:13px}
.gh .gadd:hover{background:var(--soft);color:var(--fg)}
.thead{display:grid;grid-template-columns:minmax(0,1fr) auto;font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ico{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--canvas);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--primary)}
.row .meta{min-width:0;display:flex;flex-direction:column}
.row a.name{font-weight:600;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row a.name:hover{text-decoration:underline;text-underline-offset:3px}
.row .url{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .url.unset{color:var(--danger)}
.row .open{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--surface)}
.row .open:hover{background:var(--soft)}
.row .open.set{border-style:dashed;color:var(--primary);background:transparent}
.kebab{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.kebab:hover{background:var(--soft);color:var(--fg)}
.emptyrow{padding:16px 6px 18px;color:var(--muted);font-size:13px}
.emptyrow button{border:0;background:none;color:var(--primary);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.none{padding:40px 0;color:var(--muted);text-align:center}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:21;top:max(10px,env(safe-area-inset-top,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));width:min(430px,calc(100vw - 20px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(20,28,36,.22);display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .25s ease;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:18px;font-weight:700}
.dbody{overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
form{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--canvas)}
.flabel{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label input,label select{font-weight:400;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
label.check{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg);font-weight:500}
label.check input{width:16px;height:16px;accent-color:var(--primary)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:12px;margin:0}
.factions{display:flex;gap:8px;align-items:center}
.factions .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.sugg{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px dashed var(--line)}
.sugg:first-of-type{border-top:0}
.thumb{height:96px;border-radius:12px;background:var(--canvas);border:1px solid var(--line);display:grid;place-items:center}
.thumb .tile{width:62px;height:62px;border-radius:12px;background:var(--surface);box-shadow:0 2px 8px rgba(40,52,62,.1);display:grid;place-items:center;color:var(--primary)}
.thumb svg.i{width:26px;height:26px;stroke-width:1.6}
.sugg .si{display:flex;flex-direction:column;gap:4px;min-width:0}
.sugg b{font-size:14px}
.sugg p{margin:0;font-size:12px;color:var(--muted)}
.sugg .sf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.sugg .hash{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sugg .sel{border:0;border-radius:999px;padding:5px 14px;background:var(--primary);color:var(--primary-ink);font-weight:600;font-size:12px}
.sugg .sel:disabled{background:var(--soft);color:var(--muted);cursor:default}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.pins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .mbrand{display:flex}.mbrand span{display:none}
  .cols{grid-template-columns:minmax(0,1fr)}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){
  .pins{grid-template-columns:minmax(0,1fr)}
  .search kbd,.pill.static{display:none}
  .row{grid-template-columns:36px minmax(0,1fr) auto}
  .row .open{display:none}
}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast,.pin{transition:none}}
</style>
</head>

  <aside>
    <a class="brand" href="#top" aria-label="Lot Standard Co"><svg><use href="#logo"/></svg><span>Lot Standard Co</span></a>
    <nav id="nav"></nav>
    <div class="side-spacer"></div>
    <div class="promo">
      <span class="chip"><svg><use href="#logo"/></svg></span>
      <b>Need another tool?</b>
      <p>Add any site or app to your desk and pin the ones you open most.</p>
      <button type="button" id="promoAdd">Add a link</button>
    </div>
  </aside>

  <main id="top">
    <div class="topbar">
      <a class="brand mbrand" href="#top" aria-label="Lot Standard Co"><svg><use href="#logo"/></svg><span>Lot Standard Co</span></a>
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search links…" aria-label="Search links" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="top-right">
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch theme"><svg class="i"><use id="themeIco" href="#i-sun"/></svg></button>

      </div>

      <div class="titlerow">
        <h1 id="pageTitle">Dashboard</h1>
        <span class="pill static"><svg class="i"><use href="#i-cal"/></svg><span id="date"></span></span>
        <button class="pill primary" type="button" id="addBtn"><svg class="i"><use href="#i-plus"/></svg>Add link</button>
      </div>

      <div id="groups"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dh"><h3 id="dTitle">Add Link</h3><button class="iconbtn" type="button" id="closeBtn" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="dbody">
    <form id="form">
      <span class="flabel" id="formLabel">Custom link</span>
      <label>Name<input id="fName" required maxlength="60" placeholder="e.g. Company wiki"></label>
      <label>Web address<input id="fUrl" placeholder="https://"></label>
      <div class="frow">
        <label>Group<select id="fGroup"></select></label>
        <label class="check" style="align-self:end;padding-bottom:9px"><input type="checkbox" id="fPin">Pin to top</label>
      </div>
      <p class="err" id="fErr" hidden></p>
      <div class="factions">
        <button class="btn danger" type="button" id="delBtn" hidden>Delete</button>
        <span class="sp"></span>
        <button class="btn primary" type="submit">Save link</button>
      </div>
    </form>
    <div id="suggWrap">
      <span class="flabel">Suggested for Lot Standard Co</span>
      <div id="sugg"></div>
    </div>
    <p class="note">Links you add or change are saved in this browser.</p>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const GROUPS=[
  {id:"work", name:"Google Workspace", icon:"i-work"},
  {id:"cloud",name:"Google Cloud",     icon:"i-cloud"},
  {id:"mail", name:"Email",            icon:"i-mail"},
  {id:"web",  name:"Website",          icon:"i-web"},
  {id:"other",name:"More links",       icon:"i-more"}
];
const DEFAULTS=[
  {name:"Admin console", url:"https://admin.google.com", group:"work", pinned:true},
  {name:"Drive",         url:"https://drive.google.com", group:"work"},
  {name:"Calendar",      url:"https://calendar.google.com", group:"work"},
  {name:"Docs",          url:"https://docs.google.com", group:"work"},
  {name:"Cloud console", url:"https://console.cloud.google.com", group:"cloud", pinned:true},
  {name:"Billing",       url:"https://console.cloud.google.com/billing", group:"cloud"},
  {name:"Search Console",url:"https://search.google.com/search-console", group:"cloud"},
  {name:"Gmail",         url:"https://mail.google.com", group:"mail", pinned:true},
  {name:"Company website", url:"", group:"web", pinned:true}
];
const SUGGEST=[
  {name:"Google Analytics", url:"https://analytics.google.com", group:"cloud", icon:"i-chart", tag:"Insights", text:"See who visits your website and where they come from."},
  {name:"Google Meet", url:"https://meet.google.com", group:"work", icon:"i-video", tag:"Meetings", text:"Start or join a video call with your team or clients."},
  {name:"Business Profile", url:"https://business.google.com", group:"web", icon:"i-web", tag:"Local", text:"Manage how Lot Standard Co appears in Google Search and Maps."},
  {name:"Google Account security", url:"https://myaccount.google.com/security", group:"work", icon:"i-key", tag:"Security", text:"Check sign-in activity, 2-step verification and recovery options."},
  {name:"Cloud IAM", url:"https://console.cloud.google.com/iam-admin/iam", group:"cloud", icon:"i-cloud", tag:"Access", text:"Control who can reach your Google Cloud projects."}
];
const KEY="command-desk-links-v2", OLD="command-desk-links-v1";
const $=id=>document.getElementById(id);
let links, editing=null, view="all";

function load(){
  try{const s=localStorage.getItem(KEY); if(s){const v=JSON.parse(s); if(Array.isArray(v)) return v;}}catch(e){}
  try{const s=localStorage.getItem(OLD); if(s){const v=JSON.parse(s); if(Array.isArray(v)) {const seen=new Set(); return v.map(l=>{const p=["work","cloud","mail","web"].includes(l.group)&&!seen.has(l.group); seen.add(l.group); return {...l,pinned:p}});}}}catch(e){}
  return DEFAULTS.map((l,i)=>({...l,id:"d"+i}));
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(links))}catch(e){}};
links=load();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host=u=>{try{const x=new URL(u);return x.host.replace(/^www\./,"")+(x.pathname.length>1?x.pathname.replace(/\/$/,""):"")}catch(e){return u}};
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const G=id=>GROUPS.find(g=>g.id===id)||GROUPS[4];
const ico=(id,cls="i")=>`<svg class="${cls}"><use href="#${id}"/></svg>`;

function renderNav(){
  const item=(id,label,icon,count)=>`<button class="nav${view===id?" on":""}" type="button" data-view="${id}">${ico(icon)}<span>${label}</span>${count!=null?`<span class="count">${count}</span>`:""}</button>`;
  $("nav").innerHTML=item("all","Dashboard","i-home",null)+`<div class="navlabel">Groups</div>`+
    GROUPS.map(g=>item(g.id,g.name,g.icon,links.filter(l=>l.group===g.id).length)).join("");
}

function renderPins(){
  const pins=links.filter(l=>l.pinned).slice(0,4);
  const show=view==="all" && !$("q").value.trim() && pins.length;
  $("pins").hidden=!show; if(!show) return;
  $("pins").innerHTML=pins.map(l=>{
    const g=G(l.group);
    const head=`<div class="ph"><span class="pn">${esc(l.name)}</span><span class="pi">${ico(g.icon)}</span></div>`;
    if(!l.url) return `<button class="card pin unset" type="button" data-edit="${l.id}">${head}<span class="big">Add your web address</span><span class="sub"><span class="tag">${esc(g.name)}</span>Click to set it up</span></button>`;
    return `<a class="card pin" href="${esc(l.url)}" target="_blank" rel="noopener">${head}<span class="big">${esc(host(l.url))}</span><span class="sub"><span class="tag">${esc(g.name)}</span>Open ${ico("i-arrow")}</span></a>`;
  }).join("");
  $("pins").querySelectorAll(".sub svg").forEach(s=>{s.style.width="14px";s.style.height="14px"});
}

function groupCard(g,items,q){
  const rows=items.map(l=>`<div class="row">
      <span class="ico">${esc(initials(l.name))}</span>
      <span class="meta">${l.url?`<a class="name" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`:`<span class="name" style="font-weight:600">${esc(l.name)}</span>`}
        <span class="url${l.url?"":" unset"}">${l.url?esc(host(l.url)):"No address yet"}</span></span>
      ${l.url?`<a class="open" href="${esc(l.url)}" target="_blank" rel="noopener">Open</a>`:`<button class="open set" type="button" data-edit="${l.id}">Set address</button>`}
      <button class="kebab" type="button" data-edit="${l.id}" aria-label="Edit ${esc(l.name)}">${ico("i-dots")}</button>
    </div>`).join("");
  const empty=`<div class="emptyrow">Nothing here yet. <button type="button" data-add="${g.id}">Add the first link</button></div>`;
  return `<section class="card group"><div class="gh"><h2>${esc(g.name)}</h2><span class="n">${items.length}</span>${q?"":`<button class="gadd" type="button" data-add="${g.id}">+ Add</button>`}</div>
    <div class="thead"><span>Name</span><span>Action</span></div><div class="rows">${items.length?rows:empty}</div></section>`;
}

function renderGroups(){
  const q=$("q").value.trim().toLowerCase();
  const match=l=>!q||(l.name+" "+l.url).toLowerCase().includes(q);
  const gs=view==="all"?GROUPS:GROUPS.filter(g=>g.id===view);
  const cards=gs.map(g=>{const items=links.filter(l=>l.group===g.id&&match(l)); return (q&&!items.length)?null:{g,html:groupCard(g,items,q)}}).filter(Boolean);
  if(!cards.length){$("groups").innerHTML=`<p class="none">No links match “${esc(q)}”.</p>`;return}
  if(view!=="all"||q){$("groups").innerHTML=`<div class="col">${cards.map(c=>c.html).join("")}</div>`;return}
  const left=cards.filter(c=>["work","cloud"].includes(c.g.id)), right=cards.filter(c=>!["work","cloud"].includes(c.g.id));
  $("groups").innerHTML=`<div class="cols"><div class="col">${left.map(c=>c.html).join("")}</div><div class="col">${right.map(c=>c.html).join("")}</div></div>`;
}

function renderSugg(){
  $("sugg").innerHTML=SUGGEST.map((s,i)=>{const have=links.some(l=>l.url===s.url);
    return `<div class="sugg"><div class="thumb"><span class="tile">${ico(s.icon)}</span></div>
      <div class="si"><b>${esc(s.name)}</b><p>${esc(s.text)}</p>
      <div class="sf"><span class="hash">#${esc(s.tag)}</span><button class="sel" type="button" data-sugg="${i}" ${have?"disabled":""}>${have?"Added":"Select"}</button></div></div></div>`}).join("");
}

function render(){
  renderNav(); renderPins(); renderGroups();
  $("pageTitle").textContent=view==="all"?"Dashboard":G(view).name;
}

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}

function openDrawer(link,group){
  editing=link||null;
  $("dTitle").textContent=link?"Edit Link":"Add Link";
  $("formLabel").textContent=link?"Link details":"Custom link";
  $("fName").value=link?link.name:""; $("fUrl").value=link?link.url:"";
  $("fGroup").value=link?link.group:(group||(view!=="all"?view:"other"));
  $("fPin").checked=!!(link&&link.pinned);
  $("delBtn").hidden=!link; $("delBtn").textContent="Delete"; delete $("delBtn").dataset.armed;
  $("fErr").hidden=true; $("suggWrap").hidden=!!link; renderSugg();
  $("scrim").classList.add("on"); $("drawer").classList.add("on");
  setTimeout(()=>(link&&!link.url?$("fUrl"):$("fName")).focus(),60);
}
function closeDrawer(){$("scrim").classList.remove("on");$("drawer").classList.remove("on")}

$("fGroup").innerHTML=GROUPS.map(g=>`<option value="${g.id}">${g.name}</option>`).join("");
$("addBtn").onclick=$("promoAdd").onclick=()=>openDrawer(null);
$("closeBtn").onclick=closeDrawer; $("scrim").onclick=closeDrawer;

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  let url=$("fUrl").value.trim(); const name=$("fName").value.trim();
  if(url && !/^[a-z]+:\/\//i.test(url)) url="https://"+url;
  if(url){try{const u=new URL(url); if(!/^https?:$/.test(u.protocol)||!u.hostname.includes(".")) throw 0;}catch(_){ $("fErr").textContent="Enter a web address like lotstandard.co or https://example.com."; $("fErr").hidden=false; return; }}
  else { $("fErr").textContent="Add a web address so the link has somewhere to go."; $("fErr").hidden=false; return; }
  const data={name,url,group:$("fGroup").value,pinned:$("fPin").checked};
  if(data.pinned && links.filter(l=>l.pinned&&l!==editing).length>=4){ $("fErr").textContent="You can pin up to 4 links. Unpin one first."; $("fErr").hidden=false; return; }
  if(editing) Object.assign(editing,data); else links.push({...data,id:"u"+Date.now()});
  save(); render(); closeDrawer(); toast(editing?"Link updated":"Link added");
});
$("delBtn").onclick=()=>{const b=$("delBtn");
  if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Click again to delete";return}
  links=links.filter(l=>l!==editing); save(); render(); closeDrawer(); toast("Link deleted");
};
$("sugg").addEventListener("click",e=>{const b=e.target.closest("[data-sugg]"); if(!b) return;
  const s=SUGGEST[+b.dataset.sugg]; links.push({name:s.name,url:s.url,group:s.group,id:"u"+Date.now()});
  save(); render(); renderSugg(); toast(s.name+" added");
});
document.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed){e.preventDefault(); openDrawer(links.find(l=>l.id===ed.dataset.edit)); return}
  const ad=e.target.closest("[data-add]"); if(ad){openDrawer(null,ad.dataset.add); return}
  const nv=e.target.closest("[data-view]"); if(nv){view=nv.dataset.view; render(); window.scrollTo({top:0})}
});
$("q").addEventListener("input",render);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("drawer").classList.contains("on")) closeDrawer();
  if(e.key==="/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
});

// Theme toggle
const root=document.documentElement;
function isDark(){const t=root.getAttribute("data-theme"); return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function syncThemeIcon(){$("themeIco").setAttribute("href",isDark()?"#i-moon":"#i-sun")}
try{const t=localStorage.getItem("command-desk-theme"); if(t) root.setAttribute("data-theme",t)}catch(e){}
$("themeBtn").onclick=()=>{const t=isDark()?"light":"dark"; root.setAttribute("data-theme",t); try{localStorage.setItem("command-desk-theme",t)}catch(e){} syncThemeIcon()};
syncThemeIcon();

$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
render();
</script>
</body>
</html>
